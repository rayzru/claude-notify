<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body { width: 500px; padding: 24px; background: #1f1f1f; }
.toast { width: 450px; background: #202020; border: 1px solid #2b2b2b; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,.6); padding: 10px 10px 10px 14px; }
.row { display: flex; gap: 10px; align-items: flex-start; }
.info { color: #3794ff; margin-top: 3px; }
.msg { flex: 1; line-height: 22px; }
.msg a { color: #4daafc; text-decoration: none; }
.tools { display: flex; gap: 6px; color: #cccccc; margin-top: 3px; }
.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-left: 26px; }
.src { color: #9d9d9d; font-size: 12px; }
button { font: inherit; background: #313131; color: #cccccc; border: 1px solid #3c3c3c; border-radius: 4px; padding: 3px 12px; }
</style>
<div class="toast"><div class="row"><i class="codicon codicon-info info"></i>
  <div class="msg"><a>Fix the flaky test</a>: Done · 3 min · api — Fixed the flaky test and pushed the branch.</div>
  <div class="tools"><i class="codicon codicon-gear"></i><i class="codicon codicon-close"></i></div></div>
  <div class="foot"><span class="src">Source: Notify for Claude Code</span><button>Open session</button></div></div>
